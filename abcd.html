<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Daisy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .garden-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 60px;
            max-width: 900px;
        }

        .flower-container {
            position: relative;
            width: 300px;
            height: 300px;
            animation: float 6s ease-in-out infinite;
        }

        .flower-container:nth-child(2) {
            animation-delay: 1s;
        }

        .flower-container:nth-child(3) {
            animation-delay: 2s;
        }

        .flower-container:nth-child(4) {
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }

        .petals {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .petal {
            position: absolute;
            width: 45px;
            height: 90px;
            background: linear-gradient(135deg, #ffffff 0%, #f0f0f0 100%);
            border-radius: 50% 50% 50% 0%;
            top: 50%;
            left: 50%;
            margin-left: -22.5px;
            margin-top: -90px;
            transform-origin: 22.5px 90px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            animation: petalGrow 3s ease-out forwards;
        }

        @keyframes petalGrow {
            0% {
                transform: scale(0) rotate(var(--rotation));
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(var(--rotation));
                opacity: 1;
            }
        }

        .center {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 30%, #FFD700, #FFA500, #FF8C00);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            box-shadow: 0 8px 30px rgba(255, 165, 0, 0.5),
                        inset 0 -10px 20px rgba(0, 0, 0, 0.2);
            animation: centerGrow 2s ease-out 1s forwards;
            z-index: 100;
        }

        @keyframes centerGrow {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .center::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(
                circle at center,
                transparent 0px,
                rgba(139, 69, 19, 0.3) 2px,
                transparent 4px
            );
            border-radius: 50%;
        }

        /* Sparkles */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: sparkle 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.9);
        }

        @keyframes sparkle {
            0%, 100% { 
                opacity: 0; 
                transform: scale(0) rotate(0deg); 
            }
            50% { 
                opacity: 1; 
                transform: scale(1.5) rotate(180deg); 
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: particleFloat 10s ease-in-out infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px) scale(1);
                opacity: 0;
            }
        }

        /* Glow effect */
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.3;
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 0.6;
            }
        }

        .hindi-text {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 1px;
            font-weight: 300;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow"></div>
    <div class="garden-grid">
        <div class="flower-container">
            <div class="petals" id="petals1"></div>
            <div class="center"></div>
        </div>
        <div class="flower-container">
            <div class="petals" id="petals2"></div>
            <div class="center"></div>
        </div>
        <div class="flower-container">
            <div class="petals" id="petals3"></div>
            <div class="center"></div>
        </div>
        <div class="flower-container">
            <div class="petals" id="petals4"></div>
            <div class="center"></div>
        </div>
    </div>
    <div class="hindi-text">पसंदीदा फूल के लिए पसंदीदा फूल</div>

    <script>
        const petalCount = 16;
        
        // Create petals for all 4 flowers
        for (let flowerNum = 1; flowerNum <= 4; flowerNum++) {
            const petalsContainer = document.getElementById(`petals${flowerNum}`);
            
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const angle = (360 / petalCount) * i;
                petal.style.setProperty('--rotation', `${angle}deg`);
                petal.style.animationDelay = `${i * 0.1 + (flowerNum - 1) * 0.5}s`;
                petalsContainer.appendChild(petal);
            }
        }
        
        // Create sparkles
        for (let i = 0; i < 20; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = `${Math.random() * 100}%`;
            sparkle.style.top = `${Math.random() * 100}%`;
            sparkle.style.animationDelay = `${Math.random() * 2}s`;
            document.body.appendChild(sparkle);
        }
        
        // Create floating particles
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 10}s`;
            particle.style.animationDuration = `${8 + Math.random() * 6}s`;
            document.body.appendChild(particle);
        }
    </script>
</body>
</html>
